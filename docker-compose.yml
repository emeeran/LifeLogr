services:
  app:
    build: .
    # Bind the published port to host loopback only. LifeLogr is a single-user,
    # unauthenticated local app — exposing its API on all host interfaces would
    # let anything on the LAN read/overwrite the journal. For a networked/reverse-
    # proxy deploy, front this with an authenticated proxy instead of widening
    # this binding.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Single durable-state mount: the SQLite DB, media, and TTS cache all
      # live under DATA_DIR (/app/backend/data in the image).
      - ./data:/app/backend/data
    env_file:
      # Optional so a fresh clone (no backend/.env yet) still composes.
      # APP_ENV=production makes the app refuse to boot until .env sets a real
      # SECRET_KEY and keeps the loopback-bind validation — by design.
      - path: ./backend/.env
        required: false
    environment:
      - APP_ENV=production
      - DATA_DIR=/app/backend/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
